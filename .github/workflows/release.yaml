name: "release"
on:
  push:
    tags: ['v*']
    branches: [ main ]

# Never cancel a run mid-publish
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache: true

      - name: Release
        if: github.event.ref != 'refs/heads/main'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: github.event.ref == 'refs/heads/main'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: build --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package
        if: github.event.ref == 'refs/heads/main'
        run: |
          tar -zcf go-tpc_latest_linux_amd64.tar.gz  -C dist/go-tpc_linux_amd64_v1 go-tpc
          tar -zcf go-tpc_latest_linux_arm64.tar.gz  -C dist/go-tpc_linux_arm64_v8.0 go-tpc
          tar -zcf go-tpc_latest_darwin_amd64.tar.gz -C dist/go-tpc_darwin_amd64_v1 go-tpc
          tar -zcf go-tpc_latest_darwin_arm64.tar.gz -C dist/go-tpc_darwin_arm64_v8.0 go-tpc

      - name: Update latest release
        if: github.event.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Force-move the stable tag instead of delete + recreate, so the ref never disappears.
          git tag -f latest "$SHA"
          git push -f origin refs/tags/latest

          # Upsert the release. Deleting and recreating it 404s every consumer in the meantime.
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --prerelease \
              --draft=false \
              --title "Latest Build ($SHA)" \
              --notes "Development build: \`$SHA\`"
          else
            gh release create latest \
              --prerelease \
              --title "Latest Build ($SHA)" \
              --notes "Development build: \`$SHA\`"
          fi

          gh release upload latest --clobber -- *.tar.gz

          # gh publishes as a separate API call after uploading assets; make sure it stuck.
          gh release edit latest --draft=false

      - name: Verify latest release is public
        if: github.event.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          draft=true
          for i in 1 2 3 4 5; do
            draft=$(gh release view latest --json isDraft -q .isDraft)
            [ "$draft" = "false" ] && break
            echo "latest is still a draft (attempt $i); re-publishing"
            gh release edit latest --draft=false || true
            sleep 10
          done
          if [ "$draft" != "false" ]; then
            echo "::error::latest release is still a draft after 5 attempts"
            exit 1
          fi

          for asset in go-tpc_latest_linux_amd64.tar.gz go-tpc_latest_linux_arm64.tar.gz \
                       go-tpc_latest_darwin_amd64.tar.gz go-tpc_latest_darwin_arm64.tar.gz; do
            url="https://github.com/${{ github.repository }}/releases/download/latest/$asset"
            # Anonymous ranged GET: exactly what cloud-init sees. --retry-all-errors covers CDN lag.
            curl -fsSL -r 0-0 -o /dev/null --retry 5 --retry-delay 10 --retry-all-errors "$url" \
              || { echo "::error::$url is not publicly downloadable"; exit 1; }
          done
